name: CI

on:
  push:
    branches: [dev, staging]
  pull_request:
    branches: [staging, main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck
        env:
          DATABASE_URL: postgresql://localhost/portfoliohub_ci
          PAYLOAD_SECRET: ci-test-secret-not-real-min-32-chars-xx
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          NEXT_PUBLIC_PLATFORM_DOMAIN: korp-cbm.com
          UPSTASH_REDIS_REST_URL: https://ci-dummy.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-dummy-token-not-real

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    defaults:
      run:
        working-directory: platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://localhost/portfoliohub_ci
          PAYLOAD_SECRET: ci-test-secret-not-real-min-32-chars-xx
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          NEXT_PUBLIC_PLATFORM_DOMAIN: korp-cbm.com
          UPSTASH_REDIS_REST_URL: https://ci-dummy.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-dummy-token-not-real
          R2_ENDPOINT: https://ci-dummy.r2.cloudflarestorage.com
          R2_BUCKET_NAME: portfoliohub-ci
          R2_ACCESS_KEY_ID: ci-dummy-key-id
          R2_SECRET_ACCESS_KEY: ci-dummy-secret-key
          RESEND_API_KEY: re_ci_dummy_key
          RESEND_FROM_EMAIL: noreply@korp-cbm.com
